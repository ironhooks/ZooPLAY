
name: Toffee Playlist Auto Updater

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toffee-playlist-updater
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout Public Repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          repository: srhady/axsportspvt
          ref: main
          token: ${{ secrets.PAT_TOKEN }}
          path: private_script_dir
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Move Script to Root
        shell: bash
        run: |
          set -euo pipefail
          test -f private_script_dir/toffee_extractor.py
          cp private_script_dir/toffee_extractor.py .
          rm -rf private_script_dir

      - name: Run Toffee Extractor Script
        run: python toffee_extractor.py

      - name: Verify Playlist Files
        shell: bash
        run: |
          set -euo pipefail
          test -s toffee_playlist.json
          test -s toffee_playlist.m3u

      - name: Commit and Push Changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add toffee_playlist.json toffee_playlist.m3u

          if git diff --cached --quiet; then
            echo "No playlist changes to commit."
            exit 0
          fi

          git commit -m "Auto-update Toffee Playlist [skip ci]"
          git push origin HEAD:main
