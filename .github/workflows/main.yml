
name: Next Version

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-version
  cancel-in-progress: false

jobs:
  validate:
    name: Validate M3U Playlist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ZooPLAY repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo
          persist-credentials: false

      - name: Validate M3U file
        shell: bash
        run: |
          set -euo pipefail

          FILE="main-repo/Next.m3u"

          if [[ ! -f "$FILE" ]]; then
            echo "::error::Next.m3u was not found."
            find main-repo -maxdepth 2 -type f -not -path '*/.git/*'
            exit 1
          fi

          if [[ ! -s "$FILE" ]]; then
            echo "::error::Next.m3u is empty."
            exit 1
          fi

          if ! head -n 1 "$FILE" | grep -q '^#EXTM3U'; then
            echo "::error::Invalid M3U header."
            exit 1
          fi

          echo "M3U validation successful."

      - name: Upload M3U artifact
        uses: actions/upload-artifact@v4
        with:
          name: Next-Version-M3U
          path: main-repo/Next.m3u
          retention-days: 1
          if-no-files-found: error
