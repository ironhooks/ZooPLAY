
name: Next Version

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: next-version-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: public-repo

      - name: Check source configuration
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ vars.SOURCE_REPOSITORY }}
          SOURCE_FILE: ${{ vars.SOURCE_FILE }}
        run: |
          set -euo pipefail

          if [[ -z "$SOURCE_REPOSITORY" || -z "$SOURCE_FILE" ]]; then
            echo "::error::Configure SOURCE_REPOSITORY and SOURCE_FILE."
            exit 1
          fi

          echo "Source configuration is present."

      - name: Validate destination
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d public-repo/.git ]]; then
            echo "::error::Public repository checkout failed."
            exit 1
          fi

          echo "Destination repository is ready."
