
name: Next Version

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-version
  cancel-in-progress: false

jobs:
  validate:
    name: Validate M3U
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private source repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPOSITORY }}
          ref: main
          token: ${{ secrets.SYNC_PAT }}
          path: source
          persist-credentials: false

      - name: Validate M3U file
        shell: bash
        run: |
          set -euo pipefail

          FILE="toffee.m3u"

          if [[ ! -f "$FILE" ]]; then
            echo "::error::toffee.m3u was not found."
            exit 1
          fi

          if [[ ! -s "$FILE" ]]; then
            echo "::error::toffee.m3u is empty."
            exit 1
          fi

          if ! head -n 1 "$FILE" | grep -q '^#EXTM3U'; then
            echo "::error::Invalid M3U header."
            exit 1
          fi

          echo "M3U validation successful."

      - name: Upload M3U artifact
        uses: actions/upload-artifact@v4
        with:
          name: Next-Version-M3U
          path: source/toffee.m3u
          retention-days: 1
          if-no-files-found: error
