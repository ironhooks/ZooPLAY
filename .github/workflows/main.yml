
name: Next Version

on:
  schedule:
    # Test: 10:53 PM Bangladesh time = 16:53 UTC
    - cron: "55 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: next-version
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch and Validate M3U
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: newzooplay/ZoFFee-ToFFee
          ref: main
          token: ${{ secrets.SYNC_PAT }}
          path: private-source
          persist-credentials: false

      - name: Validate playlist
        shell: bash
        run: |
          set -euo pipefail

          FILE="private-source/toffee.m3u"

          if [[ ! -f "$FILE" ]]; then
            echo "::error::toffee.m3u was not found."
            echo "Available files:"
            find private-source -maxdepth 3 -type f \
              -not -path '*/.git/*' | sort
            exit 1
          fi

          if [[ ! -s "$FILE" ]]; then
            echo "::error::toffee.m3u is empty."
            exit 1
          fi

          if ! head -n 1 "$FILE" | grep -q '^#EXTM3U'; then
            echo "::error::Invalid M3U header."
            exit 1
          fi

          echo "Playlist validation successful."

      - name: Prepare renamed artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp private-source/toffee.m3u output/Next.m3u
          echo "Created output/Next.m3u"

      - name: Upload Next.m3u artifact
        uses: actions/upload-artifact@v4
        with:
          name: Next-M3U
          path: output/Next.m3u
          retention-days: 1
          if-no-files-found: error

      - name: Commit and Push Changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          cp output/Next.m3u ./Next.m3u

          git add Next.m3u

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update Next.m3u [skip ci]"
            git push origin HEAD:main
          fi
